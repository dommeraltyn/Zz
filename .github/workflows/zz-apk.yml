name: Zz APK

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architecture"
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - arm
          - x86_64
          - all

permissions:
  contents: read

concurrency:
  group: zz-apk
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_HTTP_MULTIPLEXING: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare java package dir
        run: mkdir -p scripts/android/files/java/org/zz

      - name: Fix line endings
        run: |
          find scripts -type f \( -name '*.sh' -o -name 'gradlew' -o -name '*.gradle' -o -name '*.properties' -o -name '*.pro' \) -exec sed -i 's/\r$//' {} +
          find scripts -type f \( -name '*.sh' -o -name 'gradlew' \) -exec chmod +x {} +
          sed -i 's/\r$//' src/game/version.h

      - name: Ensure cmake/checksummed_extra.txt
        run: |
          if [ ! -f cmake/checksummed_extra.txt ]; then
            mkdir -p cmake
            cat > cmake/checksummed_extra.txt <<'EOT'
          ${CMAKE_VERSION}
          ${PROJECT_VERSION}
          ${TARGET_BITS}
          ${TARGET_CPU_ARCHITECTURE}
          ${CMAKE_SYSTEM_NAME}
          ${WEBSOCKETS}
          ${MYSQL}
          ${AUTOUPDATE}
          ${INFORM_UPDATE}
          ${VIDEORECORDER}
          ${UPNP}
          ${ANTIBOT}
          ${HEADLESS_CLIENT}
          ${CLIENT}
          ${SERVER}
          ${TOOLS}
          ${STEAM}
          ${DISCORD}
          ${DISCORD_DYNAMIC}
          ${DEV}
          ${CMAKE_BUILD_TYPE}
          ${CMAKE_CXX_COMPILER_ID}
          EOT
            echo 'восстановлен cmake/checksummed_extra.txt (теряется при передаче сурса)'
          fi

      - name: Add prebuilt Android libraries
        run: |
          if [ ! -d ddnet-libs/sdl ]; then
            echo "ddnet-libs отсутствует в репозитории, клонирую целиком"
            rm -rf ddnet-libs
            git clone --depth 1 https://github.com/ddnet/ddnet-libs ddnet-libs
          else
            git clone --depth 1 https://github.com/ddnet/ddnet-libs /tmp/upstream-libs
            find ddnet-libs -type d -name android -prune -exec rm -rf {} +
            rm -rf ddnet-libs/sdl/java
            (cd /tmp/upstream-libs && find . -type d \( -name android -o -path './sdl/java' \) -prune -print) | while read -r d; do
              mkdir -p "ddnet-libs/$d"
              cp -r "/tmp/upstream-libs/$d/." "ddnet-libs/$d/"
            done
          fi
          ls ddnet-libs/sdl ddnet-libs/curl

      - name: Prepare Linux
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build openjdk-21-jdk openssl
          curl -LO https://github.com/Kitware/CMake/releases/download/v3.22.1/cmake-3.22.1-Linux-x86_64.tar.gz
          mkdir -p /home/runner/cmake
          tar --strip-components 1 -C /home/runner/cmake -xf cmake-3.22.1-Linux-x86_64.tar.gz
          rustup default 1.92.0
          cargo install cargo-ndk
          rustup target add armv7-linux-androideabi i686-linux-android aarch64-linux-android x86_64-linux-android
          scripts/android/download_android_sdk.sh /home/runner

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true

      - name: Cache Rust dependencies
        continue-on-error: true
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src/mastersrv
            src/masterping
            ./

      - name: Build APK
        env:
          TW_KEY_NAME: /home/runner/App.jks
          TW_KEY_ALIAS: Zz-Key
        run: |
          printf '%s' '' | base64 -d > "$TW_KEY_NAME"
          export TW_KEY_PW='ba0f16c5b28e1d9c'
          export TW_VERSION_CODE="$(grep '#define DDNET_VERSION_NUMBER' src/game/version.h | awk '{print $3}' | tr -d '\r')"
          export TW_VERSION_NAME="$(grep '#define GAME_RELEASE_VERSION_INTERNAL' src/game/version.h | awk '{print $3}' | tr -d '\r')"
          export TW_VERSION_CODE="${TW_VERSION_CODE:-1}"
          export TW_VERSION_NAME="${TW_VERSION_NAME:-1.0}"
          echo "version: $TW_VERSION_NAME ($TW_VERSION_CODE)"
          export ANDROID_HOME="/home/runner/Android/Sdk"
          unset ANDROID_SDK_ROOT
          export PATH=/home/runner/cmake/bin:$PATH
          scripts/android/cmake_android.sh "${{ inputs.arch || 'arm64' }}" Zz org.zz.client Release build-zz
          mkdir artifacts
          mv build-zz/Zz.apk artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zz-android-${{ inputs.arch || 'arm64' }}
          path: artifacts
